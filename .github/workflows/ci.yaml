name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: core-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        node-version: [22, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the manifest-pinned package manager and matrix runtime
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          package-json-file: package.json
          runtime: "node@${{ matrix.node-version }}"
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile --no-runtime
      - name: Check text hygiene, types, and compiler lint rules
        run: pnpm check
      - name: Run coverage-gated tests
        run: pnpm test:cov

  quality-gate:
    name: quality
    if: ${{ always() }}
    needs: [quality]
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require every Node.js quality job to pass
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
        run: test "$QUALITY_RESULT" = success
