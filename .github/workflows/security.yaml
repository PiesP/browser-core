name: Security Scanning

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 1 * * 0"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: core-security-${{ github.ref }}
  cancel-in-progress: true

env:
  # google/osv-scanner-action image v2.3.8 (linux/amd64), resolved 2026-07-28.
  # Pin the runtime image itself: the upstream action metadata references a
  # mutable version tag even when the action is pinned to a commit SHA.
  OSV_SCANNER_IMAGE: "ghcr.io/google/osv-scanner-action@sha256:48406c58197201fe55e56615ad9d414f85063da320e204d0b0ed460fb3908dba"

jobs:
  osv-scan-pr:
    name: OSV Vulnerability Scan (PR Diff)
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout the PR base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git switch --force --detach "$BASE_SHA"

      - name: Prepare isolated OSV result directory
        run: |
          set -euo pipefail
          install -d -m 0700 "$RUNNER_TEMP/osv-results"

      - name: Scan dependencies before the PR
        continue-on-error: true
        run: |
          docker run --rm \
            --env GOTOOLCHAIN=auto \
            --volume "$GITHUB_WORKSPACE:/src" \
            --volume "$RUNNER_TEMP/osv-results:/results" \
            --workdir /src \
            "$OSV_SCANNER_IMAGE" \
            --format=json \
            --output-file=/results/old-results.json \
            -r \
            --lockfile=pnpm-lock.yaml \
            .

      - name: Checkout the PR result
        run: |
          set -euo pipefail
          git switch --force --detach "$GITHUB_SHA"

      - name: Scan dependencies after the PR
        continue-on-error: true
        run: |
          docker run --rm \
            --env GOTOOLCHAIN=auto \
            --volume "$GITHUB_WORKSPACE:/src" \
            --volume "$RUNNER_TEMP/osv-results:/results" \
            --workdir /src \
            "$OSV_SCANNER_IMAGE" \
            --format=json \
            --output-file=/results/new-results.json \
            -r \
            --lockfile=pnpm-lock.yaml \
            .

      - name: Report newly introduced vulnerabilities
        run: |
          docker run --rm \
            --entrypoint /root/osv-reporter \
            --volume "$RUNNER_TEMP/osv-results:/results" \
            --workdir /results \
            "$OSV_SCANNER_IMAGE" \
            --old=old-results.json \
            --new=new-results.json \
            --output-files=sarif:osv-results.sarif \
            '--output-files=gh-annotations:#stderr' \
            --fail-on-vuln=true

      - name: Upload OSV SARIF to GitHub Security
        if: ${{ !cancelled() }}
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: ${{ runner.temp }}/osv-results/osv-results.sarif

  osv-scan-full:
    name: OSV Vulnerability Scan (Full)
    if: ${{ github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run OSV scan
        continue-on-error: true
        run: |
          set -euo pipefail
          install -d -m 0700 "$RUNNER_TEMP/osv-results"
          docker run --rm \
            --env GOTOOLCHAIN=auto \
            --volume "$GITHUB_WORKSPACE:/src" \
            --volume "$RUNNER_TEMP/osv-results:/results" \
            --workdir /src \
            "$OSV_SCANNER_IMAGE" \
            --format=json \
            --output-file=/results/osv-results.json \
            -r \
            --lockfile=pnpm-lock.yaml \
            .

      - name: Convert OSV results to SARIF and enforce the vulnerability gate
        run: |
          docker run --rm \
            --entrypoint /root/osv-reporter \
            --volume "$RUNNER_TEMP/osv-results:/results" \
            --workdir /results \
            "$OSV_SCANNER_IMAGE" \
            --output-files=sarif:osv-results.sarif \
            --new=osv-results.json \
            --fail-on-vuln=true

      - name: Upload OSV SARIF to GitHub Security
        if: ${{ !cancelled() }}
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: ${{ runner.temp }}/osv-results/osv-results.sarif

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          category: /language:javascript-typescript

  semgrep:
    name: Static Analysis (Semgrep)
    if: ${{ github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    # semgrep/semgrep:1.171.0 — last checked: 2026-07-28
    # Check for updates: https://github.com/semgrep/semgrep/releases
    container:
      image: semgrep/semgrep:1.171.0@sha256:296fc4912420833abfcf5090ec49a81bf1330bb61fc193cd09255f88b8267ba9
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Semgrep scan
        run: |
          set -euo pipefail
          semgrep scan \
            --config=p/typescript \
            --config=p/javascript \
            --config=p/security-audit \
            --config=p/secrets \
            --error \
            --sarif \
            --output=semgrep.sarif \
            .

      - name: Upload SARIF to GitHub Security
        if: ${{ !cancelled() && hashFiles('semgrep.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: semgrep.sarif

  security-summary:
    name: Security scan summary
    if: ${{ always() }}
    needs: [osv-scan-pr, osv-scan-full, codeql, semgrep]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Summarize and validate event-specific scans
        env:
          EVENT_NAME: ${{ github.event_name }}
          OSV_PR_RESULT: ${{ needs.osv-scan-pr.result }}
          OSV_FULL_RESULT: ${{ needs.osv-scan-full.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
          SEMGREP_RESULT: ${{ needs.semgrep.result }}
        run: |
          set -euo pipefail

          {
            echo "## Security scan results"
            echo
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| OSV PR diff | $OSV_PR_RESULT |"
            echo "| OSV full | $OSV_FULL_RESULT |"
            echo "| CodeQL | $CODEQL_RESULT |"
            echo "| Semgrep | $SEMGREP_RESULT |"
          } >> "$GITHUB_STEP_SUMMARY"

          failed=0
          expect_success() {
            local label="$1"
            local result="$2"
            if [[ "$result" != "success" ]]; then
              echo "Expected $label to succeed for $EVENT_NAME, got: $result" >&2
              failed=1
            fi
          }

          expect_success "CodeQL" "$CODEQL_RESULT"
          expect_success "Semgrep" "$SEMGREP_RESULT"
          case "$EVENT_NAME" in
            pull_request)
              expect_success "OSV PR diff" "$OSV_PR_RESULT"
              ;;
            push|schedule|workflow_dispatch)
              expect_success "OSV full" "$OSV_FULL_RESULT"
              ;;
            *)
              echo "Unsupported security workflow event: $EVENT_NAME" >&2
              failed=1
              ;;
          esac

          exit "$failed"
