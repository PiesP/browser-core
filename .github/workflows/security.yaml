name: Security Scanning

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 1 * * 0"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: core-security-${{ github.ref }}
  cancel-in-progress: true

env:
  # google/osv-scanner-action image v2.6.0 (linux/amd64), resolved 2026-09-19.
  # Pin the runtime image itself: the upstream action metadata references a
  # mutable version tag even when the action is pinned to a commit SHA.
  OSV_SCANNER_IMAGE: "ghcr.io/google/osv-scanner-action@sha256:71ad04ab2f8798be47870f9b18817ad317c2f8f2f97aa6726ba10d5578bc174a"

jobs:
  osv-scan-pr:
    name: OSV Vulnerability Scan (PR Diff)
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout the PR base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git switch --force --detach "$BASE_SHA"

      - name: Setup trusted Node runtime without dependencies
        uses: PiesP/browser-core/automation/actions/setup-project@279124fa998847bd0184d2de12bdaadcd6d2f969
        with:
          install-dependencies: 'false'

      - name: Materialize immutable OSV helper outside the checkout
        env:
          TRUSTED_HELPER_SHA: e80334d25dd4edb18703d63153ef7630daf4d04b
        run: |
          set -euo pipefail
          umask 077
          helper_root="$RUNNER_TEMP/trusted-helper"
          if [[ -e "$helper_root" || -L "$helper_root" ]]; then
            echo "Trusted OSV helper root already exists." >&2
            exit 1
          fi
          mkdir -m 0700 "$helper_root"
          mkdir -m 0700 "$helper_root/scripts" "$helper_root/scripts/security" \
            "$helper_root/automation" "$helper_root/automation/security"
          git cat-file -e "$TRUSTED_HELPER_SHA^{commit}"
          for helper in \
            scripts/security/osv-workflow.ts \
            automation/security/strict-json.ts \
            automation/security/osv-report.ts \
            automation/security/validate-osv.ts; do
            git show "$TRUSTED_HELPER_SHA:$helper" > "$helper_root/$helper"
          done

      - name: Scan dependencies before the PR
        run: node "$RUNNER_TEMP/trusted-helper/scripts/security/osv-workflow.ts" scan-old

      - name: Checkout the PR result
        run: |
          set -euo pipefail
          git switch --force --detach "$GITHUB_SHA"

      - name: Scan dependencies after the PR
        run: node "$RUNNER_TEMP/trusted-helper/scripts/security/osv-workflow.ts" scan-new

      - name: Report newly introduced vulnerabilities
        run: node "$RUNNER_TEMP/trusted-helper/scripts/security/osv-workflow.ts" report-pr

      - name: Upload OSV SARIF to GitHub Security
        if: ${{ !cancelled() }}
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: ${{ runner.temp }}/osv-results/osv-results.sarif

  osv-scan-full:
    name: OSV Vulnerability Scan (Full)
    if: ${{ github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup trusted Node runtime without dependencies
        uses: PiesP/browser-core/automation/actions/setup-project@279124fa998847bd0184d2de12bdaadcd6d2f969
        with:
          install-dependencies: 'false'

      - name: Materialize immutable OSV helper outside the checkout
        env:
          TRUSTED_HELPER_SHA: e80334d25dd4edb18703d63153ef7630daf4d04b
        run: |
          set -euo pipefail
          umask 077
          helper_root="$RUNNER_TEMP/trusted-helper"
          if [[ -e "$helper_root" || -L "$helper_root" ]]; then
            echo "Trusted OSV helper root already exists." >&2
            exit 1
          fi
          mkdir -m 0700 "$helper_root"
          mkdir -m 0700 "$helper_root/scripts" "$helper_root/scripts/security" \
            "$helper_root/automation" "$helper_root/automation/security"
          git cat-file -e "$TRUSTED_HELPER_SHA^{commit}"
          for helper in \
            scripts/security/osv-workflow.ts \
            automation/security/strict-json.ts \
            automation/security/osv-report.ts \
            automation/security/validate-osv.ts; do
            git show "$TRUSTED_HELPER_SHA:$helper" > "$helper_root/$helper"
          done

      - name: Run OSV scan
        run: node "$RUNNER_TEMP/trusted-helper/scripts/security/osv-workflow.ts" scan-full

      - name: Convert OSV results to SARIF and enforce the vulnerability gate
        run: node "$RUNNER_TEMP/trusted-helper/scripts/security/osv-workflow.ts" report-full

      - name: Upload OSV SARIF to GitHub Security
        if: ${{ !cancelled() }}
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: ${{ runner.temp }}/osv-results/osv-results.sarif

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:javascript-typescript

  semgrep:
    name: Static Analysis (Semgrep)
    if: ${{ github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    # semgrep/semgrep:1.178.0 (linux/amd64) — last checked: 2026-09-25
    # Check for updates: https://github.com/semgrep/semgrep/releases
    container:
      image: semgrep/semgrep:1.178.0@sha256:fbba1f23d2ef94630c828e8692758f8bc6353a8089841a396a5c041451966ffb
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Semgrep scan
        run: |
          set -euo pipefail
          semgrep scan \
            --config=p/typescript \
            --config=p/javascript \
            --config=p/security-audit \
            --config=p/secrets \
            --error \
            --sarif \
            --output=semgrep.sarif \
            .

      - name: Upload SARIF to GitHub Security
        if: ${{ !cancelled() && hashFiles('semgrep.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: semgrep.sarif

  security-summary:
    name: Security scan summary
    if: ${{ always() }}
    needs: [osv-scan-pr, osv-scan-full, codeql, semgrep]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout immutable security helper manifest
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: e80334d25dd4edb18703d63153ef7630daf4d04b
          persist-credentials: false

      - name: Setup trusted Node runtime without dependencies
        uses: PiesP/browser-core/automation/actions/setup-project@279124fa998847bd0184d2de12bdaadcd6d2f969
        with:
          install-dependencies: 'false'

      - name: Materialize immutable OSV helper outside the checkout
        env:
          TRUSTED_HELPER_SHA: e80334d25dd4edb18703d63153ef7630daf4d04b
        run: |
          set -euo pipefail
          umask 077
          helper_root="$RUNNER_TEMP/trusted-helper"
          if [[ -e "$helper_root" || -L "$helper_root" ]]; then
            echo "Trusted OSV helper root already exists." >&2
            exit 1
          fi
          mkdir -m 0700 "$helper_root"
          mkdir -m 0700 "$helper_root/scripts" "$helper_root/scripts/security" \
            "$helper_root/automation" "$helper_root/automation/security"
          git cat-file -e "$TRUSTED_HELPER_SHA^{commit}"
          for helper in \
            scripts/security/osv-workflow.ts \
            automation/security/strict-json.ts \
            automation/security/osv-report.ts \
            automation/security/validate-osv.ts; do
            git show "$TRUSTED_HELPER_SHA:$helper" > "$helper_root/$helper"
          done

      - name: Summarize and validate event-specific scans
        env:
          EVENT_NAME: ${{ github.event_name }}
          OSV_PR_RESULT: ${{ needs.osv-scan-pr.result }}
          OSV_FULL_RESULT: ${{ needs.osv-scan-full.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
          SEMGREP_RESULT: ${{ needs.semgrep.result }}
        run: node "$RUNNER_TEMP/trusted-helper/scripts/security/osv-workflow.ts" summary
