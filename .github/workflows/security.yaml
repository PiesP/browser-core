name: Security Scanning

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 1 * * 0'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: core-security-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: --use-openssl-ca
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  SSL_CERT_DIR: /etc/ssl/certs
  # google/osv-scanner-action v2.7.0 multiarch index, resolved 2026-10-22; Ubuntu selects linux/amd64.
  # Pin the runtime image itself: the upstream action metadata references a
  # mutable version tag even when the action is pinned to a commit SHA.
  OSV_SCANNER_IMAGE: 'ghcr.io/google/osv-scanner-action@sha256:d54770fe0b09493894e76a02aaed9f51a0513fa57c5186452a755d257b0068a6'

jobs:
  osv-scan-pr:
    name: OSV Vulnerability Scan (PR Diff)
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Prepare remediated Node trust
        uses: PiesP/browser-core/automation/actions/prepare-node-trust@381b4ca733494cf069212cd0d16458389a83c623
        id: node_trust
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout the PR base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git switch --force --detach "$BASE_SHA"

      - name: Setup trusted Node runtime without dependencies
        uses: ./automation/actions/setup-project
        with:
          install-dependencies: 'false'

      - name: Materialize immutable OSV helper outside the checkout
        env:
          TRUSTED_HELPER_SHA: e80334d25dd4edb18703d63153ef7630daf4d04b
        run: |
          set -euo pipefail
          umask 077
          helper_root="$RUNNER_TEMP/trusted-helper"
          if [[ -e "$helper_root" || -L "$helper_root" ]]; then
            echo "Trusted OSV helper root already exists." >&2
            exit 1
          fi
          mkdir -m 0700 "$helper_root"
          mkdir -m 0700 "$helper_root/scripts" "$helper_root/scripts/security" \
            "$helper_root/automation" "$helper_root/automation/security"
          git cat-file -e "$TRUSTED_HELPER_SHA^{commit}"
          for helper in \
            scripts/security/osv-workflow.ts \
            automation/security/strict-json.ts \
            automation/security/osv-report.ts \
            automation/security/validate-osv.ts; do
            git show "$TRUSTED_HELPER_SHA:$helper" > "$helper_root/$helper"
          done

      - name: Scan dependencies before the PR
        run: node "$RUNNER_TEMP/trusted-helper/scripts/security/osv-workflow.ts" scan-old

      - name: Checkout the PR result
        run: |
          set -euo pipefail
          git switch --force --detach "$GITHUB_SHA"

      - name: Scan dependencies after the PR
        run: node "$RUNNER_TEMP/trusted-helper/scripts/security/osv-workflow.ts" scan-new

      - name: Report newly introduced vulnerabilities
        run: node "$RUNNER_TEMP/trusted-helper/scripts/security/osv-workflow.ts" report-pr

      - name: Upload OSV SARIF to GitHub Security
        if: ${{ steps.node_trust.outcome == 'success' && (!cancelled()) }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: ${{ runner.temp }}/osv-results/osv-results.sarif

  osv-scan-full:
    name: OSV Vulnerability Scan (Full)
    if: ${{ github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Prepare remediated Node trust
        uses: PiesP/browser-core/automation/actions/prepare-node-trust@381b4ca733494cf069212cd0d16458389a83c623
        id: node_trust
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup trusted Node runtime without dependencies
        # The reviewed Action reads runtime pins from the selected scan ref.
        uses: PiesP/browser-core/automation/actions/setup-project@38cd1cb18c9c37e57e8b53a98e811450bb1a18fc
        with:
          install-dependencies: 'false'

      - name: Materialize immutable OSV helper outside the checkout
        env:
          TRUSTED_HELPER_SHA: e80334d25dd4edb18703d63153ef7630daf4d04b
        run: |
          set -euo pipefail
          umask 077
          helper_root="$RUNNER_TEMP/trusted-helper"
          if [[ -e "$helper_root" || -L "$helper_root" ]]; then
            echo "Trusted OSV helper root already exists." >&2
            exit 1
          fi
          mkdir -m 0700 "$helper_root"
          mkdir -m 0700 "$helper_root/scripts" "$helper_root/scripts/security" \
            "$helper_root/automation" "$helper_root/automation/security"
          git cat-file -e "$TRUSTED_HELPER_SHA^{commit}"
          for helper in \
            scripts/security/osv-workflow.ts \
            automation/security/strict-json.ts \
            automation/security/osv-report.ts \
            automation/security/validate-osv.ts; do
            git show "$TRUSTED_HELPER_SHA:$helper" > "$helper_root/$helper"
          done

      - name: Run OSV scan
        run: node "$RUNNER_TEMP/trusted-helper/scripts/security/osv-workflow.ts" scan-full

      - name: Convert OSV results to SARIF and enforce the vulnerability gate
        run: node "$RUNNER_TEMP/trusted-helper/scripts/security/osv-workflow.ts" report-full

      - name: Upload OSV SARIF to GitHub Security
        if: ${{ steps.node_trust.outcome == 'success' && (!cancelled()) }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: ${{ runner.temp }}/osv-results/osv-results.sarif

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Prepare remediated Node trust
        uses: PiesP/browser-core/automation/actions/prepare-node-trust@381b4ca733494cf069212cd0d16458389a83c623
        id: node_trust
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:javascript-typescript

  semgrep:
    name: Static Analysis (Semgrep)
    if: ${{ github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    # semgrep/semgrep:1.182.0 (linux/amd64) — last checked: 2026-10-22
    # Check for updates: https://github.com/semgrep/semgrep/releases
    container:
      image: semgrep/semgrep:1.182.0@sha256:50440fe8ec1dcc2fc09a0cab0e527b66b1e0a983f2cfc1219b9c34e2f7b5567c
    steps:
      - name: Prepare remediated Node trust
        uses: PiesP/browser-core/automation/actions/prepare-node-trust@381b4ca733494cf069212cd0d16458389a83c623
        id: node_trust
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Semgrep scan
        run: |
          set -euo pipefail
          semgrep scan \
            --config=p/typescript \
            --config=p/javascript \
            --config=p/security-audit \
            --config=p/secrets \
            --error \
            --sarif \
            --output=semgrep.sarif \
            .

      - name: Upload SARIF to GitHub Security
        if: ${{ steps.node_trust.outcome == 'success' && (!cancelled() && hashFiles('semgrep.sarif') != '') }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: semgrep.sarif

  security-summary:
    name: Security scan summary
    if: ${{ always() }}
    needs: [osv-scan-pr, osv-scan-full, codeql, semgrep]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Prepare remediated Node trust
        uses: PiesP/browser-core/automation/actions/prepare-node-trust@381b4ca733494cf069212cd0d16458389a83c623
        id: node_trust
      - name: Checkout trusted runtime metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: b783358a3dd3bf167cf89a6df550166ded36dbd1
          fetch-depth: 0
          persist-credentials: false

      - name: Setup trusted Node runtime without dependencies
        # The trusted checkout supplies Vite+ pins; the helper remains at its separate immutable SHA.
        uses: PiesP/browser-core/automation/actions/setup-project@38cd1cb18c9c37e57e8b53a98e811450bb1a18fc
        with:
          install-dependencies: 'false'

      - name: Materialize immutable OSV helper outside the checkout
        env:
          TRUSTED_HELPER_SHA: e80334d25dd4edb18703d63153ef7630daf4d04b
        run: |
          set -euo pipefail
          umask 077
          helper_root="$RUNNER_TEMP/trusted-helper"
          if [[ -e "$helper_root" || -L "$helper_root" ]]; then
            echo "Trusted OSV helper root already exists." >&2
            exit 1
          fi
          mkdir -m 0700 "$helper_root"
          mkdir -m 0700 "$helper_root/scripts" "$helper_root/scripts/security" \
            "$helper_root/automation" "$helper_root/automation/security"
          git cat-file -e "$TRUSTED_HELPER_SHA^{commit}"
          for helper in \
            scripts/security/osv-workflow.ts \
            automation/security/strict-json.ts \
            automation/security/osv-report.ts \
            automation/security/validate-osv.ts; do
            git show "$TRUSTED_HELPER_SHA:$helper" > "$helper_root/$helper"
          done

      - name: Summarize and validate event-specific scans
        env:
          EVENT_NAME: ${{ github.event_name }}
          OSV_PR_RESULT: ${{ needs.osv-scan-pr.result }}
          OSV_FULL_RESULT: ${{ needs.osv-scan-full.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
          SEMGREP_RESULT: ${{ needs.semgrep.result }}
        run: node "$RUNNER_TEMP/trusted-helper/scripts/security/osv-workflow.ts" summary
