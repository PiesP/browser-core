name: Notify consumers

on:
  push:
    branches: [master]
    paths-ignore:
      - 'automation/**'
  workflow_dispatch:
    inputs:
      core_sha:
        description: Optional browser-core commit SHA to notify consumers about
        required: false
        type: string

permissions:
  contents: read

env:
  NODE_OPTIONS: --use-openssl-ca
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  SSL_CERT_DIR: /etc/ssl/certs

jobs:
  validate:
    name: Validate browser-core revision
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      core_sha: ${{ steps.revision.outputs.core_sha }}
      impact: ${{ steps.impact.outputs.impact }}
    env:
      CORE_REPOSITORY: ${{ github.repository }}
      CORE_SHA: ${{ inputs.core_sha || github.sha }}
    steps:
      - name: Prepare remediated Node trust
        uses: PiesP/browser-core/automation/actions/prepare-node-trust@381b4ca733494cf069212cd0d16458389a83c623
        id: node_trust
      - name: Check out notification workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          persist-credentials: false

      - name: Setup pinned notification runtime
        uses: PiesP/browser-core/automation/actions/setup-project@af19a6597c351f03a65e49532bdec6276e4b5ae9
        with:
          install-dependencies: 'false'

      - name: Validate commit SHA
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/notify-consumers.ts validate

      - name: Check out the validated browser-core revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.revision.outputs.core_sha }}
          fetch-depth: 0
          path: packages/core

      - name: Classify consumer impact
        id: impact
        uses: ./automation/actions/consumer-impact
        with:
          base-sha: ${{ github.event.before || '0000000000000000000000000000000000000000' }}
          head-sha: ${{ steps.revision.outputs.core_sha }}

  dispatch:
    name: Notify ${{ matrix.repository }}
    needs: validate
    if: ${{ needs.validate.outputs.impact == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        repository:
          - PiesP/wasm-motion-converter
          - PiesP/xcom-enhanced-gallery
          - PiesP/yt-live-chat-overlay
    env:
      CONSUMER_UPDATE_TOKEN_CONFIGURED: ${{ secrets.CONSUMER_UPDATE_TOKEN != '' && 'true' || 'false' }}
      CONSUMER_REPOSITORY: ${{ matrix.repository }}
      CORE_REPOSITORY: ${{ github.repository }}
      CORE_SHA: ${{ needs.validate.outputs.core_sha }}
    steps:
      - name: Prepare remediated Node trust
        uses: PiesP/browser-core/automation/actions/prepare-node-trust@381b4ca733494cf069212cd0d16458389a83c623
        id: node_trust
      - name: Check out notification workflow source
        if: ${{ env.CONSUMER_UPDATE_TOKEN_CONFIGURED == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          persist-credentials: false

      - name: Setup pinned notification runtime
        if: ${{ env.CONSUMER_UPDATE_TOKEN_CONFIGURED == 'true' }}
        uses: PiesP/browser-core/automation/actions/setup-project@af19a6597c351f03a65e49532bdec6276e4b5ae9
        with:
          install-dependencies: 'false'

      - name: Dispatch update event
        if: ${{ env.CONSUMER_UPDATE_TOKEN_CONFIGURED == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.CONSUMER_UPDATE_TOKEN }}
        run: node scripts/notify-consumers.ts dispatch

      - name: Explain scheduled fallback
        if: ${{ env.CONSUMER_UPDATE_TOKEN_CONFIGURED != 'true' }}
        run: |
          echo "::warning::CONSUMER_UPDATE_TOKEN is not configured. Consumer repositories will discover this commit on their scheduled runs."
