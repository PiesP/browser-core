name: Notify consumers

on:
  push:
    branches: [master]
    paths:
      - "src/**"
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
  workflow_dispatch:
    inputs:
      core_sha:
        description: Optional browser-core commit SHA to notify consumers about
        required: false
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Validate browser-core revision
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      core_sha: ${{ steps.revision.outputs.core_sha }}
      impact: ${{ steps.impact.outputs.impact }}
    env:
      CORE_REPOSITORY: ${{ github.repository }}
      CORE_SHA: ${{ inputs.core_sha || github.sha }}
    steps:
      - name: Validate commit SHA
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "$CORE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::core_sha must be a 40-character lowercase commit SHA"
            exit 1
          fi

          RESOLVED_SHA="$(gh api "/repos/$CORE_REPOSITORY/commits/$CORE_SHA" --jq .sha)"
          if [[ "$RESOLVED_SHA" != "$CORE_SHA" ]]; then
            echo "::error::core_sha does not resolve to the requested commit"
            exit 1
          fi

          COMPARE_STATUS="$(gh api "/repos/$CORE_REPOSITORY/compare/$CORE_SHA...master" --jq .status)"
          if [[ "$COMPARE_STATUS" != "ahead" && "$COMPARE_STATUS" != "identical" ]]; then
            echo "::error::core_sha must be reachable from browser-core master (status: $COMPARE_STATUS)"
            exit 1
          fi

          echo "core_sha=$CORE_SHA" >> "$GITHUB_OUTPUT"

      - name: Check out the notification action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out the validated browser-core revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.revision.outputs.core_sha }}
          fetch-depth: 0
          path: packages/core

      - name: Classify consumer impact
        id: impact
        uses: ./automation/actions/consumer-impact
        with:
          base-sha: ${{ github.event.before || '0000000000000000000000000000000000000000' }}
          head-sha: ${{ steps.revision.outputs.core_sha }}

  dispatch:
    name: Notify ${{ matrix.repository }}
    needs: validate
    if: ${{ needs.validate.outputs.impact == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        repository:
          - PiesP/wasm-motion-converter
          - PiesP/xcom-enhanced-gallery
          - PiesP/yt-live-chat-overlay
    env:
      GH_TOKEN: ${{ secrets.CONSUMER_UPDATE_TOKEN }}
      CONSUMER_REPOSITORY: ${{ matrix.repository }}
      CORE_REPOSITORY: ${{ github.repository }}
      CORE_SHA: ${{ needs.validate.outputs.core_sha }}
    steps:
      - name: Dispatch update event
        if: ${{ env.GH_TOKEN != '' }}
        run: |
          set -euo pipefail
          gh api --method POST \
            "/repos/$CONSUMER_REPOSITORY/dispatches" \
            --input - <<EOF
          {
            "event_type": "browser-core-updated",
            "client_payload": {
              "core_repository": "$CORE_REPOSITORY",
              "core_sha": "$CORE_SHA"
            }
          }
          EOF

      - name: Explain scheduled fallback
        if: ${{ env.GH_TOKEN == '' }}
        run: |
          echo "::warning::CONSUMER_UPDATE_TOKEN is not configured. Consumer repositories will discover this commit on their scheduled runs."
