name: Prepare paired Vitest update

on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:
    inputs:
      rehearsal:
        description: Validate the fixed historical 5.0.2 to 5.0.3 failure fixture; never publish its patch
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: paired-vitest-preparation
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      REHEARSAL: ${{ inputs.rehearsal == true && 'true' || 'false' }}
    steps:
      - name: Select task-owned output directory
        run: echo "PAIR_OUTPUT=$RUNNER_TEMP/vitest-pair-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - name: Check out maintained updater source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false
      - name: Setup pinned updater runtime without installing the target
        uses: ./automation/actions/setup-project
        with:
          install-dependencies: 'false'
      - name: Resolve and validate the pair in an isolated checkout
        run: |
          if [[ "$REHEARSAL" == true ]]; then
            node scripts/update-vitest-pair.ts --output "$PAIR_OUTPUT" --rehearsal
          else
            node scripts/update-vitest-pair.ts --output "$PAIR_OUTPUT"
          fi
      - name: Retain candidate patch and validation receipts
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vitest-pair-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ env.PAIR_OUTPUT }}/receipt.json
            ${{ env.PAIR_OUTPUT }}/vitest-pair.patch
            ${{ env.PAIR_OUTPUT }}/command-*.log
