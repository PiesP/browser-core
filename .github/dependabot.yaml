version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "Asia/Seoul"
    # Keep only a short supply-chain cooling window for these fast-moving consumers.
    cooldown:
      default-days: 1
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    reviewers:
      - "PiesP"
    allow:
      - dependency-type: "direct"
    groups:
      build:
        patterns:
          - "typescript"
        update-types:
          - "minor"
          - "patch"
      quality:
        patterns:
          - "vitest"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "Asia/Seoul"
    # Keep only a short supply-chain cooling window for these fast-moving consumers.
    cooldown:
      default-days: 1
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci(deps)"
    reviewers:
      - "PiesP"
    groups:
      actions:
        patterns:
          - "*"
