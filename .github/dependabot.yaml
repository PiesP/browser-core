version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    cooldown:
      default-days: 7
      semver-patch-days: 3
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    reviewers:
      - "PiesP"
    allow:
      - dependency-type: "direct"
    groups:
      build:
        patterns:
          - "typescript"
        update-types:
          - "minor"
          - "patch"
      quality:
        patterns:
          - "vitest"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    cooldown:
      default-days: 7
      semver-patch-days: 3
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci(deps)"
    reviewers:
      - "PiesP"
    groups:
      actions:
        patterns:
          - "*"
