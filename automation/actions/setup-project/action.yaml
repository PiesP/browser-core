name: Setup project
description: Configure the consumer-pinned toolchain and install locked dependencies

inputs:
  node-version:
    description: Optional runtime override for explicit compatibility testing; defaults to package.json volta.node
    required: false
  install-dependencies:
    description: Install locked dependencies after configuring the pinned runtime
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Resolve the manifest-pinned runtime
      id: runtime
      shell: bash
      env:
        NODE_VERSION_OVERRIDE: ${{ inputs.node-version }}
      run: node "$GITHUB_ACTION_PATH/resolve-runtime.mjs"

    - name: Install the selected Node.js runtime
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ steps.runtime.outputs.version }}
        package-manager-cache: false

    - name: Install the consumer-pinned pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        cache: true
        run_install: false
        standalone: false

    - name: Install locked dependencies
      if: ${{ inputs.install-dependencies == 'true' }}
      shell: bash
      run: pnpm install --frozen-lockfile --no-runtime
