name: Setup project
description: Configure the consumer-pinned Vite+ toolchain and install locked dependencies

inputs:
  node-version:
    description: Optional numeric runtime override for explicit compatibility testing; defaults to .node-version
    required: false
  install-dependencies:
    description: Install locked dependencies after configuring the pinned runtime
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Validate the consumer runtime pin
      shell: bash
      env:
        NODE_VERSION_OVERRIDE: ${{ inputs.node-version }}
      run: |
        set -euo pipefail
        if [[ -n "$NODE_VERSION_OVERRIDE" ]]; then
          [[ "$NODE_VERSION_OVERRIDE" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]] || {
            echo 'Expected a numeric compatibility runtime override' >&2
            exit 1
          }
        else
          [[ -f .node-version && ! -L .node-version ]] || {
            echo 'Expected a regular .node-version file' >&2
            exit 1
          }
          [[ "$(cat .node-version)" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo 'Expected an exact .node-version pin' >&2
            exit 1
          }
        fi

    - name: Validate the consumer Vite+ pin
      shell: bash
      run: |
        set -euo pipefail
        [[ -f pnpm-workspace.yaml && ! -L pnpm-workspace.yaml ]] || {
          echo 'Expected a regular pnpm-workspace.yaml file' >&2
          exit 1
        }
        version="$(sed -nE '/^catalog:$/,/^[^[:space:]#]/s/^  vite-plus: ([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' pnpm-workspace.yaml)"
        [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
          echo 'Expected an exact vite-plus pin in the default workspace catalog' >&2
          exit 1
        }

    - name: Install consumer Vite+, Node and package manager
      uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
      with:
        version-file: pnpm-workspace.yaml
        node-version: ${{ inputs.node-version }}
        node-version-file: .node-version
        run-install: 'false'
        cache: 'false'
        cache-toolchain: 'false'

    - name: Install locked dependencies
      if: ${{ inputs.install-dependencies == 'true' }}
      shell: bash
      run: vp install --frozen-lockfile -- --no-runtime
