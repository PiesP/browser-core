name: Prepare consumer OSV helper
description: Copy the reviewed provider's fixed OSV helper closure into private runner storage

outputs:
  helper-path:
    description: Absolute path to the prepared consumer OSV CLI
    value: ${{ steps.prepare.outputs.helper-path }}

runs:
  using: composite
  steps:
    - name: Prepare the provider-owned helper
      id: prepare
      shell: bash
      run: node "$GITHUB_ACTION_PATH/prepare.ts"
