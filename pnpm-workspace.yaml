allowBuilds:
  esbuild: true

# Fail closed on unreviewed dependency scripts and exotic transitive sources.
strictDepBuilds: true
blockExoticSubdeps: true

engineStrict: true

# Enforce the declared toolchain and plugin peer requirements during installs.
strictPeerDependencies: true

# This exact alias bundles Vite 8.3.4, satisfying these callers' Vite 8 ranges.
# Scope the metadata exception to reviewed callers and the selected alias only.
# Recheck both versions and their peer ranges when updating the toolchain.
peerDependencyRules:
  allowedVersions:
    '@vitest/mocker@5.0.5>vite': 1.3.0
    'vitest@5.0.5>vite': 1.3.0

# Prefer current releases while retaining a short supply-chain observation window.
minimumReleaseAge: 1440
minimumReleaseAgeIgnoreMissingTime: false
trustPolicy: no-downgrade
# Old transitive releases predate widespread provenance; scrutinize recent ones.
trustPolicyIgnoreAfter: 525600
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vitest: 5.0.5
  vite-plus: 1.3.0
  '@vitest/coverage-v8': 5.0.5
overrides:
  vite@*: 'catalog:'
  vitest@*: 'catalog:'
