allowBuilds:
  esbuild: true

# Fail closed on unreviewed dependency scripts and exotic transitive sources.
strictDepBuilds: true
blockExoticSubdeps: true

engineStrict: true

# Enforce the declared toolchain and plugin peer requirements during installs.
strictPeerDependencies: true

# Prefer current releases while retaining a short supply-chain observation window.
minimumReleaseAge: 1440
minimumReleaseAgeIgnoreMissingTime: false
trustPolicy: no-downgrade
# Old transitive releases predate widespread provenance; scrutinize recent ones.
trustPolicyIgnoreAfter: 525600
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.2.0
  vitest: 5.0.4
  vite-plus: 1.2.0
  '@vitest/coverage-v8': 5.0.4
overrides:
  vite@*: 'catalog:'
  vitest@*: 'catalog:'
